name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # The tag is the version: pyproject.toml carries no release version of its own
      # (the release is cut by the Create Release workflow, which changes the
      # CHANGELOG alone), and PyPI refuses a file name it already has.
      - name: Set the version from the tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
