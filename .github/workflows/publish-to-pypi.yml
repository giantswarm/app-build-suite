name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # The tag is the version: pyproject.toml carries no release version of its own
      # (the release is cut by the Create Release workflow, which changes the
      # CHANGELOG alone), and PyPI refuses a file name it already has.
      # version.py is what `abs --version` prints; on main it holds the post-release dev version.
      - name: Set the version from the tag
        run: |
          uv version --frozen "${GITHUB_REF_NAME#v}"
          printf 'build_ver = "%s"\n' "${GITHUB_REF_NAME}" > app_build_suite/version.py

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
