version: 2.1

orbs:
    architect: giantswarm/architect@10.13.9
    codecov: codecov/codecov@6.1.0

workflows:
    test:
        jobs:
            - run-tests:
                  name: run-tests
                  filters:
                      tags:
                          only: /^v.*/

            - architect/push-to-registries:
                  context: architect
                  name: push-to-registries
                  registries-data: |-
                      public gsoci.azurecr.io ACR_GSOCI_USERNAME ACR_GSOCI_PASSWORD true
                  # The build version, stamped into version.py by the Dockerfile.
                  build-args: |
                      VERSION=${DOCKER_IMAGE_VERSION}
                  requires:
                      - run-tests
                  filters:
                      branches:
                          ignore:
                              - main
                              - master
                              - /^renovate\/.*/
                      tags:
                          only: /^v.*/

            - architect/push-to-registries:
                  context: architect
                  name: push-to-registries-augmented
                  dockerfile: "./circleci.Dockerfile"
                  tag-suffix: "-circleci"
                  registries-data: |-
                      public gsoci.azurecr.io ACR_GSOCI_USERNAME ACR_GSOCI_PASSWORD true
                  # The -circleci image builds on the plain image this pipeline pushed
                  # just before (`requires`), at the version without the tag-suffix, so
                  # it carries the same code and needs no pin bumped at release time.
                  build-args: |
                      ABS_VERSION=${DOCKER_IMAGE_VERSION}
                  requires:
                      - run-tests
                      - push-to-registries
                  filters:
                      branches:
                          ignore:
                              - main
                              - master
                              - /^renovate\/.*/
                      tags:
                          only: /^v.*/

            - publish-github-release:
                  context: architect
                  name: publish-github-release-for-dabs
                  requires:
                      - push-to-registries-augmented
                  filters:
                      branches:
                          ignore: /.*/
                      tags:
                          only: /^v.*/

jobs:
    run-tests:
        machine:
            image: default
        steps:
            - checkout

            - run:
                  name: Execute tests
                  command: |
                      make docker-test-ci

            - codecov/upload

    # Attaches dabs.sh to the GitHub Release of the tag. The release itself is
    # created by the create_release GitHub Action, so the upload retries for a
    # minute in case it does not exist yet. The token is an installation token
    # of the architect GitHub App, from the architect context.
    publish-github-release:
        executor: architect/architect
        steps:
            - checkout
            - architect/generate-github-token
            - run:
                  name: Upload dabs.sh to the GitHub Release
                  command: |
                      repo="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
                      for i in $(seq 1 12); do
                          if err=$(gh release view "${CIRCLE_TAG}" --repo "${repo}" 2>&1 >/dev/null); then
                              exec gh release upload "${CIRCLE_TAG}" ./dabs.sh --clobber --repo "${repo}"
                          fi
                          # Only a missing release is worth waiting for; anything else
                          # (a bad token, missing permissions) fails right away.
                          if [[ "${err}" != *"release not found"* ]]; then
                              echo "${err}" >&2
                              exit 1
                          fi
                          if [[ "${i}" -lt 12 ]]; then
                              echo "Release ${CIRCLE_TAG} does not exist yet (attempt ${i}/12); sleeping 5s."
                              sleep 5
                          fi
                      done
                      echo "Release ${CIRCLE_TAG} still does not exist; giving up uploading dabs.sh." >&2
                      exit 1
